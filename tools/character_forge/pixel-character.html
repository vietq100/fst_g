<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Hero Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14121c; --panel:#1c1928; --panel2:#252134; --line:#352f49;
  --text:#ece8f6; --muted:#9a93b3; --accent:#ffb347; --accent-ink:#2a1a05;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,sans-serif}
button,input{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding:18px 24px;border-bottom:1px solid var(--line)}
.logo{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--accent);letter-spacing:1px}
header p{margin:0;color:var(--muted);font-size:14px}
.app{display:grid;grid-template-columns:minmax(300px,520px) 1fr;gap:24px;padding:24px;max-width:1280px;margin:0 auto}
@media (max-width:900px){.app{grid-template-columns:1fr;padding:16px;gap:16px}}

/* stage */
.stage{position:relative;border-radius:14px;border:1px solid var(--line);aspect-ratio:560/588;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.bg-dusk{background:linear-gradient(165deg,#465275 0%,#675d8a 45%,#a6789c 100%)}
.bg-check{background-color:#2a2638;background-image:conic-gradient(#342e47 25%,transparent 0 50%,#342e47 0 75%,transparent 0);background-size:24px 24px}
.bg-grass{background:linear-gradient(#8ccdf5 0 86%,#5a9e46 86% 100%)}
.bg-dark{background:#0c0a12}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}
.bgchip{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0}
.bgchip.on{border-color:var(--accent)}
.summary{margin-top:14px;font-size:13px;color:var(--muted);line-height:1.7}
.summary b{color:var(--text);font-weight:600}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:0 0 auto;background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.section-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.opt{background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:8px 6px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.opt:hover{border-color:var(--line)}
.opt.sel{border-color:var(--accent)}
.opt canvas{width:84px;height:84px;image-rendering:pixelated;border-radius:8px;background-color:#2c2840;background-image:conic-gradient(#322d46 25%,transparent 0 50%,#322d46 0 75%,transparent 0);background-size:12px 12px}
.opt span{font-size:13px;font-weight:600}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.crow label{width:110px;font-size:14px;color:var(--muted)}
.crow input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:7px;background:none;padding:2px;cursor:pointer}
.sw{width:24px;height:24px;border-radius:6px;border:2px solid rgba(255,255,255,.08);cursor:pointer;padding:0}
.sw:hover{border-color:#fff}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.btn.atk{background:#c8432f;border-color:#c8432f;color:#fff}
.btn.atk:hover{background:#d9523d}
kbd{font:600 11px/1 ui-monospace,monospace;background:rgba(0,0,0,.25);border-radius:4px;padding:2px 5px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:2px solid transparent;border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer;font-size:14px;font-weight:600}
.chip.sel{border-color:var(--accent)}
.chip i{width:14px;height:14px;border-radius:50%;display:block}
</style>
</head>
<body>
<header>
  <div class="logo">PIXEL HERO FORGE</div>
  <p>Xưởng thiết kế nhân vật pixel · core: đầu trọc, áo ba lỗ, quần đùi</p>
</header>

<main class="app">
  <section>
    <div class="stage bg-dusk" id="stage"><canvas id="view"></canvas></div>
    <div class="row">
      <button class="btn primary" id="rnd">🎲 Ngẫu nhiên</button>
      <button class="btn" id="core">Về core</button>
      <button class="btn" id="preset">Mẫu gốc</button>
      <button class="btn" id="png">⬇ Xuất PNG</button>
    </div>
    <div class="row">
      <button class="btn atk" id="atk">⚔ Tấn công <kbd>Space</kbd></button>
      <label class="toggle"><input type="checkbox" id="loopAtk"> Lặp đòn đánh</label>
    </div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="anim" checked> Hoạt ảnh</label>
      <label class="toggle"><input type="checkbox" id="black"> Viền đen</label>
      <label class="toggle"><input type="checkbox" id="grid"> Lưới pixel</label>
      <span style="flex:1"></span>
      <button class="bgchip bg-dusk on" data-bg="bg-dusk" title="Hoàng hôn"></button>
      <button class="bgchip bg-check" data-bg="bg-check" title="Trong suốt"></button>
      <button class="bgchip bg-grass" data-bg="bg-grass" title="Đồng cỏ"></button>
      <button class="bgchip bg-dark" data-bg="bg-dark" title="Tối"></button>
    </div>
    <div class="summary" id="summary"></div>
  </section>

  <section class="panel">
    <nav class="tabs" id="tabs"></nav>
    <div id="tabBody"></div>
  </section>
</main>

<script>
/* ============================================================
   ENGINE — lưới 32×46, mỗi item là các "part" vẽ bằng ký tự
   b=nền  h=sáng  s=tối  d=tối sâu  a/A=màu phụ (sáng/tối)
   w=trắng  g/G=kim loại  L=kính đen  l=kính trong (màu phụ)
   c/C=sừng  y=vàng  e/E=mắt  k=má hồng  m=miệng  p=bóng đổ
   Viền tự sinh quanh mỗi part (4 hướng).
   ============================================================ */
const W = 40, H = 42, OX = 14, OY = 4, S = 30;   // S = UNIT: mọi lớp đồ ra số điểm ảnh nguyên
const P = (x, y, rows, o = {}) => ({ x, y, rows, ...o });
const NO = { outline: false };
const BLACK = [27, 22, 34];

/* ---------- màu ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function hexToRgb(hex) { let h = hex.replace('#', ''); if (h.length === 3) h = [...h].map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbToHex(c) { return '#' + c.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return [h, s * 100, l * 100];
}
function hslToRgb(h, s, l) {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0) * 255, f(8) * 255, f(4) * 255].map(Math.round);
}
function hueToward(h, t, amt) { const d = ((t - h + 540) % 360) - 180; return (h + Math.sign(d) * Math.min(Math.abs(d), amt) + 360) % 360; }
function tone(rgb, dl, ds, toward, amt) {
  let [h, s, l] = rgbToHsl(...rgb);
  if (s > 4) h = hueToward(h, toward, amt);
  return hslToRgb(h, clamp(s + ds, 0, 100), clamp(l + dl, 3, 97));
}
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
// ramp màu kiểu pixel art: bóng ngả lạnh (tím xanh), sáng ngả ấm (vàng)
function ramp(hex) {
  const b = hexToRgb(hex), [h, s, l] = rgbToHsl(...b);
  return {
    h: tone(b, l > 85 ? 5 : 11, -4, 55, 8),
    b,
    s: tone(b, -12, 4, 250, 10),
    d: tone(b, -22, 6, 250, 16),
    o: hslToRgb(s > 4 ? hueToward(h, 250, 18) : h, clamp(s * .7 + 8, 0, 70), clamp(l * .28, 5, 20)),
    i: hslToRgb(s > 4 ? hueToward(h, 250, 14) : h, clamp(s * .8 + 10, 0, 75), clamp(l * .38, 10, 28)), // nét trong
  };
}
const FIXED = {
  w: { c: [245, 242, 234] }, g: { c: [201, 206, 214] }, G: { c: [139, 147, 163] },
  L: { c: [28, 33, 48] }, c: { c: [239, 226, 192] }, C: { c: [196, 176, 134] },
  y: { c: [242, 193, 78] }, p: { c: [20, 10, 30], a: .22 }, W: { c: [255, 255, 255], a: .6 },
  r: { c: [214, 66, 66] }, R: { c: [150, 38, 50] }, Y: { c: [190, 138, 48] },
};
function makePal(color, accent) {
  const r = ramp(color), a = ramp(accent || color);
  return { ...FIXED, b: { c: r.b }, h: { c: r.h }, s: { c: r.s }, d: { c: r.d },
    a: { c: a.b }, A: { c: a.s }, l: { c: a.h, a: .45 }, o: r.o, i: r.i };
}
function bodyPal(cfg, blink) {
  const p = makePal(cfg.skin), eye = { c: hexToRgb(cfg.eyes) };
  p.e = eye; p.E = blink ? p.b : eye;
  p.k = { c: mix(p.b.c, [255, 105, 120], .4) };
  p.m = { c: mix(p.s.c, [150, 45, 60], .55) };
  return p;
}

/* ---------- vẽ ---------- */
/* ---------- vẽ: danh sách ô vuông, toạ độ theo đơn vị UNIT = 30 phần mỗi pixel nhân vật ----------
   Nhân vật: ô 30 · áo/mũ 1.5× → ô 20 · vũ khí 2× → ô 15 · kính 2.5× → ô 12 (đều là số nguyên → pixel sắc nét) */
const UNIT = 30, OCC = 10;              // occ: lưới chiếm chỗ (10 ô / pixel nhân vật) để biết viền trong/ngoài, bóng đổ
const RES = { weapon: 2, shirt: 1.5, hat: 1.5, glasses: 2.5 };
const DIR4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const newGrid = () => ({ ops: [], occ: new Uint8Array(W * OCC * H * OCC) });
function occAt(g, ux, uy) {              // 0 trống · 1 viền ngoài · 2 đã tô · 3 ngoài khung
  const x = Math.floor(ux * OCC / UNIT), y = Math.floor(uy * OCC / UNIT);
  return x < 0 || y < 0 || x >= W * OCC || y >= H * OCC ? 3 : g.occ[y * W * OCC + x];
}
function addRect(g, ux, uy, s, c, a = 1, kind = 2) {
  if (ux >= W * UNIT || uy >= H * UNIT || ux + s <= 0 || uy + s <= 0) return;
  g.ops.push({ x: ux, y: uy, s, c, a: a >= 1 ? 1 : a });
  if (!kind) return;
  const k = OCC / UNIT, OW = W * OCC;
  const x0 = Math.max(0, Math.round(ux * k)), x1 = Math.min(OW, Math.round((ux + s) * k));
  const y0 = Math.max(0, Math.round(uy * k)), y1 = Math.min(H * OCC, Math.round((uy + s) * k));
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const i = y * OW + x; if (kind === 2) g.occ[i] = 2; else if (g.occ[i] < 2) g.occ[i] = 1;
  }
}
const putC = (g, X, Y, c, a = 1, kind = 2) => addRect(g, X * UNIT, Y * UNIT, UNIT, c, a, kind);  // 1 pixel nhân vật
const SHADE = [38, 22, 60];
const KEY = (x, y) => (x + 4096) * 16384 + (y + 4096);
const partBase = (part, dx, dy) => [(part.res ? part.ox : part.x * UNIT) + (OX + dx) * UNIT, (part.res ? part.oy : part.y * UNIT) + (OY + dy) * UNIT];
function drawPart(g, part, pal, { dx = 0, dy = 0, clip = null, outline = 'color', cast = false, inner = true }) {
  const f = part.res || 1, U = UNIT / f, inn = part.inner ?? inner;   // part.res: độ phân giải riêng (đồ chi tiết)
  const [bx, by] = partBase(part, dx, dy), ux = x => bx + x * U, uy = y => by + y * U;
  const kindAt = (x, y) => occAt(g, ux(x) + U / 2, uy(y) + U / 2);
  const cells = [], set = new Set();
  part.rows.forEach((row, ry) => {
    if (clip !== null && !part.res && part.y + ry < clip) return;
    for (let rx = 0; rx < row.length; rx++) {
      const ch = row[rx]; if (ch === '.' || ch === ' ') continue;
      cells.push([rx, ry, ch]); set.add(KEY(rx, ry));
    }
  });
  if (part.outline !== false) {
    // viền ngoài silhouette: đen (hoặc màu đậm); viền nằm đè lên chi tiết khác: tông tối của chính nó.
    // Đồ chi tiết có cờ thick: viền ngoài dày ≈ 1 pixel nhân vật, nét trong chỉ 1 ô của chính nó.
    const outer = outline === 'black' ? BLACK : pal.o, T = part.thick ? Math.round(f) : 1, seen = new Set(set);
    let front = cells;
    for (let d = 1; d <= T; d++) {
      const next = [];
      for (const [x, y] of front)
        for (const [ax, ay] of DIR4) {
          const nx = x + ax, ny = y + ay, k = KEY(nx, ny);
          if (seen.has(k)) continue; seen.add(k);
          const kd = kindAt(nx, ny); if (kd === 3) continue;
          if (kd === 2) { if (d === 1 && inn) addRect(g, ux(nx), uy(ny), U, pal.i, 1, 2); continue; } // tóc (inn=false): chỉ đổ bóng
          addRect(g, ux(nx), uy(ny), U, outer, 1, 1); next.push([nx, ny]);
        }
      front = next;
    }
  }
  for (const [x, y, ch] of cells) { const e = pal[ch]; if (e) addRect(g, ux(x), uy(y), U, e.c, e.a ?? 1, ch === 'p' ? 0 : 2); }
  if (cast) { // bóng đổ (ánh sáng từ trên-trái): tóc lên trán, cằm lên cổ áo, mũ lên tóc...
    const done = new Set(), n = Math.round(f);
    for (const [x, y] of cells)
      for (const [nx, ny] of inn ? Array.from({ length: n }, (_, i) => [x, y + 2 + i]) : [[x, y + 1], [x + 1, y]]) {
        const k = KEY(nx, ny);
        if (done.has(k) || set.has(k) || kindAt(nx, ny) !== 2) continue;
        if (inn && set.has(KEY(x, y + 1))) continue;
        done.add(k); addRect(g, ux(nx), uy(ny), U, SHADE, .2, 0);
      }
  }
}

const rep = (s, n) => Array(n).fill(s);
/* ============================================================
   CORE — tỉ lệ lấy từ ảnh mẫu (≈16×35 px, nhìn 3/4 sang trái)
   Toạ độ thiết kế: đầu x4..15 / y3..17, thân x6..11 / y18..27,
   tay xa x3..4, tay gần x12..15, chân xa x6..7, chân gần x11..12
   ============================================================ */
const HEAD = [
  "..hhbbbb....", // 3
  ".hhbbbbbbs..",
  "hhbbbbbbbbs.",
  "hbbbbbbbbbs.",
  "hbbbbbbbbbss", // 7
  "hbbbbbbbbbss",
  "bbbbbbbbbbss",
  "bbbbbbbbbbss",
  "bbbbbbbbbbss", // 11
  "bEbbbbEbbbss", // 12 mắt xa x5, mắt gần x10
  "bebbbbebbss.",
  "bkkbbbkkbs..", // 14 má
  "skkbbbkkbs..",
  ".sbbmmbbs...", // 16 miệng
  "..sbbbbs....", // 17 cằm
];
const BODY = {
  legs: [
    P(5, 28, [...rep(".bb", 5), ".bs", "bbs"]),                     // chân xa (bàn chân y34)
    P(10, 28, [...rep(".bb", 6), ".bs", "bbs"]),                    // chân gần (bàn chân y35)
  ],
  upper: [
    P(3, 19, [...rep("ss", 8), "sb", "bb"]),                        // tay xa
    P(5, 18, [".bbbbbb.", ".hbbbbbs", ".hbbbbs.", ".hbbbbs.", ".hbbbbs.", // thân: vai xuôi,
      "..hbbbbs", "..hbbbbs", ".hbbbbbs", "hbbbbbbs", "ssssssss"]),         // eo lệch về phía gần
    P(12, 18, ["hbbs", "bbbs", ...rep("..bs", 8), "..bb", "..ss"]), // vai + tay gần
  ],
  head: [P(4, 3, HEAD)],
};
const SHADOW = [P(3, 35, [".pppppppppp.", "..pppppppp.."], NO)];
const UNDER = {
  tank: [P(5, 18, [".bb..bb.", ".hbbbbs.", ".hbbbbs.", ".hbbsbs.", ".hbbbbs.", "..hbbbbs", "..hbsbbs", ".sssssss"])],
  shorts: [P(6, 26, ["dddddd.", "hbbbbbs", "hbbbbbs", "hbs.hbs", "sss.sss"])],
};

/* ============================================================
   ITEMS
   ============================================================ */
// tay áo: vai tròn, bắp tay rộng hơn cổ tay, nếp gấp ở khuỷu
const SLEEVE_S = { far: P(3, 19, ["ss", "dd"]), near: P(12, 18, [".hb.", "hbbs", "hbbs", ".dds"]) };
const SLEEVE_L = {
  far: P(3, 19, ["ss", "ss", "ds", "ss", "sd", "ss", "dd"]),
  near: P(12, 18, [".hb.", "hbbs", "hbbs", ".hbs", ".hbs", "..bs", "..sb", "..bs", "..dd"]),
};
const mkShirt = (sl, torso) => [sl.far, P(5, 18, torso), sl.near];

// tóc ngắn — chép theo ảnh mẫu; K = pixel tai (màu da) lộ giữa tóc mai
const SHORT_HAIR = [
  "....hhbbbbbb....", // 3
  "...hbbbbbbbbbs..",
  "..bbhbhhhbhbbbs.",
  ".bbbbbbbbbbbbbbs",
  "dssssssssssssssd", // 7
  ".dss......dsbbs.", // 8 trán lộ ra
  "..d........dbbs.",
  "..d.........bbs.",
  "..d.........bbs.",
  "..d.........bKs.", // 12 tai
  "............bKs.",
  ".............s..",
];
const BOB_TOP = [
  "....hhbbbbbb....", // 3
  "...hbbbbbbbbbs..",
  "..bbhbhhhbhbbbs.",
  ".bbbbbbbbbbbbbbs",
  ".bbbbbbbbbbbbbbs", // 7
  ".bbbbbbbbbbbbbbs",
  ".bbsbbsbbsbbbbbs", // 9 mái
];
const SIDE_SHORT = ["..b.........bbs.", "..b.........bKs.", "............bKs.", ".............s.."]; // y10..13
const PIXIE_TOP = [  // mái vuốt lệch về phía mặt, y3..9
  "....hhbbbbbb....",
  "...hbbhbbbbbbs..",
  "..hbbbbbhbbbbbs.",
  ".hbbbbbbbbbbbbbs",
  ".bbbbbbbbbbbbbbs",
  ".bbbbbbbbsbbbbs.",
  ".bbbbbs...sbbbs.",
];
// tóc dài chảy ra sau gáy, xuống sau vai gần (bên phải) — vẽ sau lưng nhân vật
const LONG_BACK = P(11, 6, [
  "..ssss...", ".ssssss..", "sssssss..", "ssssssss.", "ssdsssss.", "ssdssdss.", "ssdssdss.",
  ...rep("ssdssdsss", 4), ...rep("ssdssdsds", 5), ".sdssdsds", ".sdssdsd.", "..dssdsd.", "...sdsd..", "....dd..."]);
const WAVY_BACK = P(11, 6, [
  "..ssss...", ".ssssss..", "sssssss..", "ssssssss.", "ssdsssss.", "ssssssss.", "ssdssss..", "sssssssss",
  "sssssdss.", "ssssssss.", "ssssdsss.", "sssssssss", "sssssdsss", "ssssssss.", "ssdsssss.", "sssssssss",
  ".ssssssds", "..ssssss.", "...sssd..", "....ss...", ".....d..."]);
const TIED = { inner: true }; // phần tóc buộc riêng: có nét tối tách khỏi tóc chính

function nonLa() {
  const hws = [1, 2.4, 3.8, 5.2, 6.6, 8, 9.4, 10.8, 11.8], rows = [];
  hws.forEach((hw, i) => {
    let r = '';
    for (let x = -3; x <= 20; x++) {
      const dc = x + .5 - 9;
      if (Math.abs(dc) >= hw) { r += '.'; continue; }
      let ch = 'b';
      if (i === hws.length - 1) ch = 'd';
      else if (i % 3 === 2) ch = 's';
      else if (dc < -hw * .4) ch = 'h';
      else if (dc > hw * .5) ch = 's';
      r += ch;
    }
    rows.push(r);
  });
  return [P(-3, -4, rows)];
}

    const wst = archer ? { K: KW, arrow: !!pose.arrow, pull: pose.arrow ? Math.max(0, gm.H[0] - G[0] - 3.53) : 0 }
      : { K: KW, pull: pose ? pose.pull || 0 : 0, arrow: pose ? !!pose.arrow : false };
    wPart = rasterizeFine(KW, G[0], G[1], wp.reach, local(G[0], G[1], ang, (u, v) => wp.shape(u, v, wst)));
  }
  const drawWeapon = () => {
    if (!wPart) return;
    drawPart(g, wPart, wpal, { outline });
    if (el !== 'none') aura(g, wPart, fc[1], pose ? .55 : .25 + .15 * Math.sin(t / 140));
  };

  D(SHADOW, FIXED);
  // lớp mặt đất: vòng phép, sóng chấn động
  if (pose && pose.circle != null) {
    const rx = 6.5 + pose.circle, a = .5 + pose.circle * .2;
    fxRing(g, 9.5, GROUND, rx, rx * .3, fc[1], a, .12);
    fxRing(g, 9.5, GROUND, rx * .62, rx * .62 * .3, fc[2], a * .8);
    for (let k = 0; k < 6; k++) { const an = t * .004 + k * Math.PI / 3; fput(g, 9.5 + Math.cos(an) * rx * .82, GROUND + Math.sin(an) * rx * .82 * .3, fc[0], a); }
  }
  const hit = frames && wp.anim ? impactPoint(frames, wp) : null;
  if (pose && pose.shock != null) {
    const rx = 3 + pose.shock * 3.5 + p * 3;
    fxRing(g, hit[0], GROUND, rx, rx * .32, fc[pose.shock ? 1 : 0], fade, .15);
  }
  const hairPal = { ...pal('hair'), K: skin.s };
  D(it.hair.back, hairPal, { ...up, clip });
  const FK = (parts, f) => parts && parts.map(q => fineOf(q, f));   // áo, mũ: phóng lên độ phân giải riêng
  D(FK(it.shirt.back, KS), pal('shirt'), up);
  if (pose && pose.behind) drawWeapon();
  if (wp.id === 'bow') D(quiverParts(oy, KW), wpal);
  D(BODY.legs, skin);
  D(archer ? BODY.upper.slice(1, 2) : posed ? BODY.upper.slice(0, 2) : BODY.upper, skin, up);
  if (it.pants.parts) D(it.pants.parts, pal('pants')); else D(UNDER.shorts, makePal(cfg.shorts));
  D(it.shoes.parts, pal('shoes'));
  const isFar = q => q.x <= 4 && q.rows[0].length <= 3;   // tay áo phía xa
  const shirtParts = it.shirt.parts && (posed ? it.shirt.parts.filter(q => !q.near && !(archer && isFar(q))) : it.shirt.parts);
  if (it.shirt.parts) D(FK(shirtParts, KS), pal('shirt'), up); else D(UNDER.tank, makePal(cfg.tank), up);
  if (wp.id === 'bow') drawPart(g, quiverStrap(oy, KW), wpal, { outline, dx: ox });
  const fist = (hx, hy) => drawPart(g, rasterize(hx, hy, 2.5, (px, py) =>
    Math.hypot(px - hx, py - hy) <= 1.25 ? (py - hy > .35 || px - hx > .5 ? 's' : 'b') : null), skin, { outline });
  if (archer) {                    // tay xa duỗi thẳng cầm cung (sau đầu, trước thân)
    armParts(gm.FS, 180, kind, sp, skin, gm.FS[0] - gm.G[0], KS).forEach(([pt, pl]) => drawPart(g, pt, pl, { outline }));
    drawWeapon(); fist(gm.G[0], gm.G[1]);
  }
  D(BODY.head, skin, { ...up, cast: true });
  D(it.hair.parts, hairPal, { ...up, clip, cast: true, inner: false });
  if (GLASS_FINE[it.glasses.id]) {
    const outlined = it.glasses.id === 'goggle' || it.glasses.id === 'patch';
    drawPart(g, rasterizeFine(RES.glasses, 9, 12.5, 7, GLASS_FINE[it.glasses.id](RES.glasses), { outline: outlined }), pal('glasses'), { outline, ...up });
  } else D(it.glasses.parts, pal('glasses'), up);
  D(FK(it.hat.parts, RES.hat), pal('hat'), { ...up, cast: true });

  if (!posed) return g;
  // ---- tay cầm vũ khí (nghỉ hoặc đang ra đòn) ----
  if (pose && pose.arc) fxArc(g, gm.S, ARM_LEN + wp.tip - 4, ARM_LEN + wp.tip + .5, pose.arc[0], pose.arc[1], fc, fade);
  if (archer) {                    // tay gần: khuỷu nâng ra sau, cẳng tay kéo dây về má
    const seg = (A, B, k) => armParts(A, Math.atan2(B[1] - A[1], B[0] - A[0]) * 180 / Math.PI, k, sp, skin, Math.hypot(B[0] - A[0], B[1] - A[1]), KS);
    [...seg(gm.S, gm.E, kind), ...seg(gm.E, gm.H, kind === 'long' ? 'long' : 'none')].forEach(([pt, pl]) => drawPart(g, pt, pl, { outline }));
  } else {
    if (!(pose && pose.behind)) drawWeapon();
    armParts(gm.S, pose ? pose.arm : gm.arm, kind, sp, skin, pose ? ARM_LEN : gm.len, KS).forEach(([pt, pl]) => drawPart(g, pt, pl, { outline }));
  }
  fist(gm.H[0], gm.H[1]);          // nắm tay đè lên chuôi / dây cung
  if (!pose) return g;
  // ---- hiệu ứng đòn đánh ----

  const [tx, ty] = gm.T;
  if (pose.lines) for (let i = -2; i <= 2; i++) {        // vệt tốc độ sau mũi đâm
    const len = 3 + ((i + 5) * 7 + seed) % 4;
    fline(g, tx + 2 + Math.abs(i), ty + i * 1.3, tx + 2 + Math.abs(i) + len, ty + i * 1.3, fc[i ? 1 : 0], fade * .7);
  }
  if (pose.mark != null) fxCross(g, tx - 1 + pose.mark * .5, ty - pose.mark * .5, 1.5 + pose.mark * .5, fc, fade);
  if (pose.charge != null) {                              // tụ lực
    const o = wp.anim === 'cast' ? [gm.G[0] + wp.tip * Math.cos(rad(pose.wpn)), gm.G[1] + wp.tip * Math.sin(rad(pose.wpn))] : [tx, ty];
    fxGlow(g, o[0], o[1], 1.4 + pose.charge + .4 * Math.sin(t / 50), fc, .85);
    const r = rng32(seed);
    for (let i = 0; i < 10; i++) { const an = r() * Math.PI * 2, q = (t * .003 + r()) % 1, d = 7 * (1 - q); fput(g, o[0] + Math.cos(an) * d, o[1] + Math.sin(an) * d, fc[q > .6 ? 0 : 1], .9); }
  }
  if (pose.strike != null) fxStrike(g, el, CAST_X, pose.strike, p, t, seed, fc, fade);
  if (pose.proj != null) {                                // mũi tên bay
    const ax = gm.G[0] - 7.5 - 3.5 * (pose.proj + p), ay = gm.G[1];
    fline(g, ax + 1, ay, ax + 9, ay, fc[1], .7); fline(g, ax + 3, ay - 1, ax + 7, ay - 1, fc[2], .4);
    drawPart(g, rasterizeFine(KW, ax, ay, 6, local(ax, ay, 180, (u, v) => arrowShape(u, v, { K: KW }))), wpal, { outline });
  }
  const fi0 = frames.findIndex(f => f.hit);
  if (pose.hit) fxBurst(g, hit[0], hit[1], 2.5 + p * 2.5, fc, 1 - p * .4);
  if (fi >= fi0) fxParticles(g, el, hit[0], hit[1], 3.5, 12, t, seed, fc, fade);
  return g;
}

function paint(ctx, g, scale, sx = 0, sy = 0, w = W, h = H) {
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  const k = scale / UNIT, X0 = sx * UNIT, Y0 = sy * UNIT, X1 = (sx + w) * UNIT, Y1 = (sy + h) * UNIT;
  for (const o of g.ops) {
    if (o.x + o.s <= X0 || o.y + o.s <= Y0 || o.x >= X1 || o.y >= Y1) continue;
    const x0 = Math.round((o.x - X0) * k), y0 = Math.round((o.y - Y0) * k);
    ctx.fillStyle = `rgba(${o.c[0] | 0},${o.c[1] | 0},${o.c[2] | 0},${o.a})`;
    ctx.fillRect(x0, y0, Math.round((o.x + o.s - X0) * k) - x0, Math.round((o.y + o.s - Y0) * k) - y0);
  }
}

/* ============================================================
   STATE + UI
   ============================================================ */
const SKIN_SW = ['#fbe0c8', '#f6cfa9', '#e7b48a', '#c98b5e', '#9c6644', '#6b4330'];
const EYE_SW = ['#1e1726', '#3b5bb5', '#3f8f50', '#7a4a2a', '#a03a3a'];
const HAIR_SW = ['#1f1a1c', '#4a3022', '#8a5a32', '#d9a441', '#f1e3b3', '#c0472f', '#e8e8ee', '#6b5ac9', '#3f8f74', '#e070a8'];
const CLOTH_SW = ['#d24a43', '#e58a3a', '#f2c14e', '#5aa65a', '#3f8f74', '#3f6db3', '#5b3fa0', '#c2456b', '#ecebe4', '#4c505c', '#2b2630', '#8a5a32'];
const CATS = [
  { key: 'body', label: 'Cơ thể' }, { key: 'hair', label: 'Tóc' }, { key: 'shirt', label: 'Áo' },
  { key: 'pants', label: 'Quần' }, { key: 'shoes', label: 'Giày' }, { key: 'glasses', label: 'Kính' }, { key: 'hat', label: 'Mũ' },
  { key: 'weapon', label: 'Vũ khí' },
];
const THUMB = { hair: [12, 1, 21], hat: [12, 0, 21], glasses: [15, 9, 14], shirt: [12, 17, 21], pants: [12, 21, 21], shoes: [15, 28, 14], weapon: [12, 8, 28] };
function paintThumb(cv, g, k) {
  const [sx, sy, sz] = THUMB[k], sc = Math.floor(84 / sz), off = (84 - sz * sc) / 2, ctx = cv.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 84, 84); ctx.translate(off, off);
  paint(ctx, g, sc, sx, sy, sz, sz);
}

const sel = (k, id) => { const o = findItem(k, id); return { id, color: o.color || '#888888', accent: o.accent || o.color || '#888888' }; };
const coreCfg = () => ({
  skin: '#f4c4a3', eyes: '#3a1a0c', tank: '#ecebe4', shorts: '#3f6db3', black: true,
  hair: { id: 'none', color: '#4a3022', accent: '#e0507a' },
  shirt: sel('shirt', 'none'), pants: sel('pants', 'none'), shoes: sel('shoes', 'none'),
  glasses: sel('glasses', 'none'), hat: sel('hat', 'none'), weapon: sel('weapon', 'none'), fx: 'none', wres: 3,
});
const presetCfg = () => ({
  ...coreCfg(),
  hair: { id: 'short', color: '#47352e', accent: '#e0507a' },
  shirt: sel('shirt', 'armor'), pants: sel('pants', 'armor'),
  shoes: sel('shoes', 'armor'), weapon: sel('weapon', 'sword'),
});

let cfg = presetCfg(), tab = 'hair';
try { const s = JSON.parse(localStorage.getItem('pixelforge.ref.v1')); if (s && s.hair) cfg = { ...cfg, ...s }; } catch (e) {}
const save = () => { try { localStorage.setItem('pixelforge.ref.v1', JSON.stringify(cfg)); } catch (e) {} };

const view = document.getElementById('view');
view.width = W * S; view.height = H * S;
const vctx = view.getContext('2d');
let anim = { bob: 0, blink: false };

function renderView(st = anim) {
  const g = compose(cfg, st);
  paint(vctx, g, S);
  const sh = st.pose && st.pose.shake;   // rung màn hình khi đòn nặng trúng đích
  view.style.transform = sh ? `translate(${(Math.random() - .5) * sh * .9}%, ${(Math.random() - .5) * sh * .6}%)` : '';
  if (document.getElementById('grid').checked) {
    vctx.strokeStyle = 'rgba(255,255,255,.07)'; vctx.lineWidth = 1; vctx.beginPath();
    for (let x = 1; x < W; x++) { vctx.moveTo(x * S + .5, 0); vctx.lineTo(x * S + .5, H * S); }
    for (let y = 1; y < H; y++) { vctx.moveTo(0, y * S + .5); vctx.lineTo(W * S, y * S + .5); }
    vctx.stroke();
  }
}
function renderSummary() {
  const label = { hair: 'Tóc', shirt: 'Áo', pants: 'Quần', shoes: 'Giày', glasses: 'Kính', hat: 'Mũ', weapon: 'Vũ khí' };
  document.getElementById('summary').innerHTML = OPT_CATS
    .map(k => `${label[k]}: <b>${findItem(k, cfg[k].id).name}</b>`).join(' · ') + ` · Hiệu ứng: <b>${FX[cfg.fx || 'none'].name}</b>`;
}
function refresh() { renderView(); renderSummary(); save(); }

/* ---------- panel ---------- */
const tabsEl = document.getElementById('tabs'), bodyEl = document.getElementById('tabBody');
function renderTabs() {
  tabsEl.innerHTML = CATS.map(c => `<button class="tab ${c.key === tab ? 'on' : ''}" data-k="${c.key}">${c.label}</button>`).join('');
}
tabsEl.addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; tab = b.dataset.k; renderTabs(); renderPanel(); });

function colorRow(label, value, swatches, onChange) {
  const row = document.createElement('div'); row.className = 'crow';
  row.innerHTML = `<label>${label}</label><input type="color" value="${value}">` +
    swatches.map(c => `<button class="sw" style="background:${c}" data-c="${c}" title="${c}"></button>`).join('');
  const inp = row.querySelector('input');
  inp.addEventListener('input', () => onChange(inp.value));
  row.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => { inp.value = b.dataset.c; onChange(b.dataset.c); }));
  return row;
}
function title(t) { const d = document.createElement('div'); d.className = 'section-title'; d.textContent = t; return d; }

function renderPanel() {
  bodyEl.innerHTML = '';
  if (tab === 'body') {
    bodyEl.append(title('Core'));
    bodyEl.append(colorRow('Màu da', cfg.skin, SKIN_SW, v => { cfg.skin = v; refresh(); }));
    bodyEl.append(colorRow('Màu mắt', cfg.eyes, EYE_SW, v => { cfg.eyes = v; refresh(); }));
    bodyEl.append(colorRow('Áo ba lỗ', cfg.tank, CLOTH_SW, v => { cfg.tank = v; refresh(); }));
    bodyEl.append(colorRow('Quần đùi', cfg.shorts, CLOTH_SW, v => { cfg.shorts = v; refresh(); }));
    const p = document.createElement('p'); p.className = 'hint';
    p.textContent = 'Áo ba lỗ và quần đùi là lớp core — tự hiện khi chọn “Ba lỗ” ở tab Áo và “Quần đùi” ở tab Quần.';
    bodyEl.append(p);
    return;
  }
  const k = tab, cur = findItem(k, cfg[k].id);
  bodyEl.append(title('Mẫu'));
  const grid = document.createElement('div'); grid.className = 'opts';
  ITEMS[k].forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt' + (o.id === cfg[k].id ? ' sel' : '');
    const cv = document.createElement('canvas'); cv.width = cv.height = 84;
    b.append(cv); const sp = document.createElement('span'); sp.textContent = o.name; b.append(sp);
    const keepColor = k === 'hair' || o.id === cfg[k].id;
    const t = { ...cfg, [k]: keepColor ? { ...cfg[k], id: o.id } : sel(k, o.id) };
    paintThumb(cv, compose(t), k);
    b.addEventListener('click', () => {
      cfg[k] = k === 'hair' ? { ...cfg.hair, id: o.id } : sel(k, o.id);
      refresh(); renderPanel();
    });
    grid.append(b);
  });
  bodyEl.append(grid);
  if (k === 'weapon') weaponExtras();
  if (!cur.parts && !cur.shape) return;
  bodyEl.append(title('Màu'));
  const sw = k === 'hair' ? HAIR_SW : CLOTH_SW;
  const thumbs = () => { refresh(); refreshThumbs(); };
  bodyEl.append(colorRow('Màu chính', cfg[k].color, sw, v => { cfg[k].color = v; thumbs(); }));
  if (usesAccent(cur)) bodyEl.append(colorRow('Màu phụ', cfg[k].accent, CLOTH_SW, v => { cfg[k].accent = v; thumbs(); }));
}
function weaponExtras() {
  bodyEl.append(title('Hiệu ứng nguyên tố'));
  const box = document.createElement('div'); box.className = 'chips';
  Object.entries(FX).forEach(([id, f]) => {
    const b = document.createElement('button'); b.className = 'chip' + ((cfg.fx || 'none') === id ? ' sel' : '');
    b.innerHTML = `<i style="background:radial-gradient(circle at 35% 35%, ${f.c[0]}, ${f.c[1]} 55%, ${f.c[2]})"></i>${f.name}`;
    b.onclick = () => { cfg.fx = id; refresh(); renderPanel(); startAttack(); };
    box.append(b);
  });
  bodyEl.append(box);
  const p = document.createElement('p'); p.className = 'hint';
  const w = findItem('weapon', cfg.weapon.id);
  const desc = { slash: 'chém vòng cung', heavy: 'chém nặng + chấn động', stab: 'đâm nhanh hai nhát', thrust: 'đâm thẳng',
    smash: 'bổ xuống + sóng chấn động', cast: 'vòng phép + cột năng lượng', shoot: 'giương cung bắn tên' };
  p.textContent = w.anim ? `Đòn đánh: ${desc[w.anim]}. Bấm “Tấn công” hoặc phím Space để xem.` : 'Chọn một vũ khí để có đòn đánh.';
  bodyEl.append(p);
}
function refreshThumbs() {
  const k = tab; if (k === 'body') return;
  bodyEl.querySelectorAll('.opt').forEach((b, i) => {
    const o = ITEMS[k][i], keep = k === 'hair' || o.id === cfg[k].id;
    paintThumb(b.querySelector('canvas'), compose({ ...cfg, [k]: keep ? { ...cfg[k], id: o.id } : sel(k, o.id) }), k);
  });
}

/* ---------- actions ---------- */
const pick = a => a[Math.floor(Math.random() * a.length)];
document.getElementById('rnd').onclick = () => {
  const c = coreCfg(); c.skin = pick(SKIN_SW); c.eyes = pick(EYE_SW); c.black = cfg.black;
  c.hair = { id: pick(ITEMS.hair).id, color: pick(HAIR_SW), accent: pick(CLOTH_SW) };
  for (const k of ['shirt', 'pants', 'shoes', 'glasses', 'hat']) {
    const pool = ITEMS[k].slice(1), none = { glasses: .55, hat: .4, shoes: .1 }[k] || .12;
    const o = Math.random() < none ? ITEMS[k][0] : pick(pool);
    c[k] = { id: o.id, color: Math.random() < .5 && o.color ? o.color : pick(CLOTH_SW), accent: o.accent ? (Math.random() < .5 ? o.accent : pick(CLOTH_SW)) : undefined };
    if (!o.accent) c[k].accent = c[k].color;
  }
  c.tank = pick(CLOTH_SW); c.shorts = pick(CLOTH_SW);
  c.weapon = Math.random() < .2 ? sel('weapon', 'none') : sel('weapon', pick(ITEMS.weapon.slice(1)).id);
  c.fx = pick(Object.keys(FX));
  c.wres = cfg.wres; cfg = c; refresh(); renderPanel();
};
document.getElementById('core').onclick = () => { const { black, wres } = cfg; cfg = { ...coreCfg(), black, wres }; refresh(); renderPanel(); };
document.getElementById('preset').onclick = () => { const { black, wres } = cfg; cfg = { ...presetCfg(), black, wres }; refresh(); renderPanel(); };
document.getElementById('png').onclick = () => {
  const c = document.createElement('canvas'), sc = 30; c.width = W * sc; c.height = H * sc;   // 30 điểm ảnh / pixel nhân vật
  paint(c.getContext('2d'), compose(cfg), sc);
  const a = document.createElement('a'); a.download = 'nhan-vat-pixel.png'; a.href = c.toDataURL('image/png'); a.click();
};
const blackEl = document.getElementById('black');
blackEl.checked = !!cfg.black;
blackEl.onchange = () => { cfg.black = blackEl.checked; refresh(); refreshThumbs(); };
document.getElementById('grid').onchange = renderView;
document.querySelectorAll('.bgchip').forEach(b => b.onclick = () => {
  document.querySelectorAll('.bgchip').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('stage').className = 'stage ' + b.dataset.bg;
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input')) return;
  if (e.key === 'r') document.getElementById('rnd').click();
  if (e.code === 'Space') { e.preventDefault(); startAttack(); }
});

/* ---------- idle animation: thở + chớp mắt ---------- */
const animEl = document.getElementById('anim');
let attack = null, nextAuto = 0;
function startAttack() {
  if (attack) return;
  if (!findItem('weapon', cfg.weapon.id).anim) { cfg.weapon = sel('weapon', 'sword'); refresh(); if (tab === 'weapon') renderPanel(); }
  const w = findItem('weapon', cfg.weapon.id);
  attack = { start: performance.now(), frames: ANIMS[w.anim], seed: Math.random() * 1e9 | 0 };
}
document.getElementById('atk').onclick = startAttack;
const loopEl = document.getElementById('loopAtk');
function loop(t) {
  if (attack) {                              // phát chuỗi khung đòn đánh
    const el = t - attack.start; let acc = 0, fi = -1;
    for (let i = 0; i < attack.frames.length; i++) { if (el < acc + attack.frames[i].d) { fi = i; break; } acc += attack.frames[i].d; }
    if (fi < 0) { attack = null; nextAuto = t + 650; renderView(anim); }
    else {
      const f = attack.frames[fi];
      renderView({ pose: f, frames: attack.frames, fi, p: (el - acc) / f.d, t: el, seed: attack.seed });
    }
    requestAnimationFrame(loop); return;
  }
  if (loopEl.checked && t > nextAuto && findItem('weapon', cfg.weapon.id).anim) { startAttack(); requestAnimationFrame(loop); return; }
  const on = animEl.checked;
  const next = { bob: on ? Math.floor(t / 520) % 2 : 0, blink: on && (t % 3400) < 140, t };
  const glow = cfg.fx && cfg.fx !== 'none' && findItem('weapon', cfg.weapon.id).shape;  // hào quang nhấp nháy
  if (next.bob !== anim.bob || next.blink !== anim.blink || (glow && t - (anim.t || 0) > 90)) { anim = next; renderView(); }
  requestAnimationFrame(loop);
}

renderTabs(); renderPanel(); refresh(); requestAnimationFrame(loop);
</script>
</body>
</html>
